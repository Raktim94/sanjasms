name: CI

# Runs on every PR (including Dependabot) so dependency bumps are build-checked
# before the security auto-merge workflow is allowed to merge them.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
