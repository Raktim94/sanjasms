{{define "pages_form.html"}}
{{template "admin_layout" .}}
{{end}}

{{define "content"}}
<div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>{{if .IsNew}}New Page{{else}}Edit Page{{end}}</h1>
    <a href="/admin/pages" class="btn btn-secondary">Cancel</a>
</div>

<div class="card">
    {{if .Error}}<p style="color:red;">{{.Error}}</p>{{end}}
    <form method="POST" action="{{if .IsNew}}/admin/pages{{else}}/admin/pages/{{.Page.ID}}{{end}}">
        <div style="display:flex; gap: 20px;">
            <div style="flex:2;">
                <label style="display:block; margin-bottom:5px;">Page Title</label>
                <input type="text" name="title" value="{{.Page.Title}}" required
                    style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ddd;">

                <label style="display:block; margin-bottom:5px;">Custom HTML Content (Supports Embeds & Scripts)</label>
                <textarea name="html_content"
                    style="width:100%; height:400px; padding:8px; border:1px solid #ddd; font-family:monospace;">{{.Page.HTMLContent}}</textarea>
                <p style="font-size:0.8em; color:#666;">You can paste YouTube iframes, Google Maps, or raw HTML here.
                </p>
            </div>
            <div style="flex:1; background:#f9f9f9; padding:15px; border-radius:4px;">
                <h3>Publishing</h3>
                <label>
                    <input type="checkbox" name="is_published" {{if .Page.IsPublished}}checked{{end}}> Published
                </label>

                <h3 style="margin-top:20px;">SEO & Metadata</h3>

                <label style="display:block; margin-bottom:5px;">URL Slug</label>
                <input type="text" name="slug" value="{{.Page.Slug}}" placeholder="e.g. about-us"
                    style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ddd;">

                <label style="display:block; margin-bottom:5px;">Meta Title</label>
                <input type="text" name="meta_title" value="{{.Page.MetaTitle}}"
                    style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ddd;">

                <label style="display:block; margin-bottom:5px;">Meta Description</label>
                <textarea name="meta_description"
                    style="width:100%; height:60px; padding:8px; margin-bottom:15px; border:1px solid #ddd;">{{.Page.MetaDescription}}</textarea>

                <label style="display:block; margin-bottom:5px;">Meta Keywords</label>
                <input type="text" name="meta_keywords" value="{{.Page.MetaKeywords}}"
                    style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ddd;">
            </div>
        </div>
        <div style="margin-top:20px; text-align:right;">
            <button type="submit" class="btn">Save Page</button>
        </div>
    </form>
</div>
{{end}}
