{{define "admin_layout"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - sanjanacms Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div id="toast-container"></div>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-logo">S</span>
                <span>sanjanacms</span>
            </div>
            <nav>
                <a href="/admin/dashboard" class="{{if eq .Active " dashboard"}}active{{end}}">
                    <span class="icon">📊</span> Dashboard
                </a>
                <div class="nav-group">Website</div>
                <a href="/admin/pages" class="{{if eq .Active " pages"}}active{{end}}">
                    <span class="icon">📄</span> Pages
                </a>
                <a href="/admin/menus" class="{{if eq .Active " menus"}}active{{end}}">
                    <span class="icon">🗺️</span> Menus
                </a>
                <a href="/admin/media" class="{{if eq .Active " media"}}active{{end}}">
                    <span class="icon">🖼️</span> Media
                </a>
                <div class="nav-group">Configuration</div>
                <a href="/admin/embeds" class="{{if eq .Active " embeds"}}active{{end}}">
                    <span class="icon">🔗</span> Embeds
                </a>
                <a href="/admin/users" class="{{if eq .Active " users"}}active{{end}}">
                    <span class="icon">👥</span> Users
                </a>
                <a href="/admin/settings" class="{{if eq .Active " settings"}}active{{end}}">
                    <span class="icon">⚙️</span> Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/admin/logout" class="logout-link">
                    <span class="icon">🚪</span> Logout
                </a>
            </div>
        </aside>
        <main class="content-area">
            <header class="topbar">
                <div class="topbar-left">
                    <h2 class="page-title">{{.Title}}</h2>
                </div>
                <div class="topbar-right">
                    <a href="/" target="_blank" class="btn btn-secondary">
                        View Website <span style="margin-left:5px">↗</span>
                    </a>
                    <div class="user-avatar">AD</div>
                </div>
            </header>
            <div class="main-content">
                {{template "content" .}}
            </div>
        </main>
    </div>
    <script src="/static/admin.js"></script>
</body>

</html>
{{end}}
