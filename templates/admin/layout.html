{{define "admin_layout"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - sanjanacms Admin</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="brand">sanjanacms</div>
            <nav>
                <a href="/admin/dashboard" class="{{if eq .Active " dashboard"}}active{{end}}">Dashboard</a>
                <a href="/admin/pages" class="{{if eq .Active " pages"}}active{{end}}">Pages</a>
                <a href="/admin/menus" class="{{if eq .Active " menus"}}active{{end}}">Menus</a>
                <a href="/admin/media" class="{{if eq .Active " media"}}active{{end}}">Media</a>
                <a href="/admin/settings" class="{{if eq .Active " settings"}}active{{end}}">Settings</a>
            </nav>
        </aside>
        <main class="content-area">
            <header class="topbar">
                <div class="user-info">Admin User</div>
                <a href="/" target="_blank">View Website ↗</a>
                <a href="/admin/logout" style="color: var(--danger-color);">Logout</a>
            </header>
            <div class="main-content">
                {{template "content" .}}
            </div>
        </main>
    </div>
</body>

</html>
{{end}}
